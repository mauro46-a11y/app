<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi ubicación</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="contenedor">

        <h1>Mi ubicación</h1>

        <p class="instruccion">
            Haz clic en el icono para solicitar tu ubicación.
        </p>


        <button id="botonUbicacion" class="boton-icono">

            <img
                src="icono.svg"
                alt="Obtener ubicación"
            >

        </button>


        <div id="resultado" class="resultado">

            <p>
                Esperando que hagas clic en el icono...
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
